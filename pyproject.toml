[project]
name = "youtab"
version = "0.2.3"
description = "手元の動画ファイルから、画面に写るタブ譜を alphaTab の HTML＋alphaTex に書き起こす"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "shimabox", email = "shimabox@gmail.com" }
]
requires-python = ">=3.11,<3.12"
dependencies = [
    "jinja2>=3.1.6",
    "numpy>=2.3",
    "pillow>=11.3",
    "pypdfium2>=5.13,<5.14",
]

[project.scripts]
youtab = "youtab.cli:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
]

[tool.pytest.ini_options]
pythonpath = ["tests"]
testpaths = ["tests"]
addopts = "-n auto"
